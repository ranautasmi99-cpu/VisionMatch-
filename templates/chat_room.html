{% extends "base.html" %}

{% block title %}Chat - VisionMatch{% endblock %}

{% block content %}
<div class="chat-room-container" style="max-width: 800px; margin: 2rem auto; display: flex; flex-direction: column; height: 70vh; background-color: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    
    <div class="chat-header" style="padding: 1rem; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h3 style="margin: 0;">Chat about: {{ item.name }}</h3>
            
            <form method="POST" action="{{ url_for('auth.block', user_id=other_user_id) }}" onsubmit="return confirm('Are you sure you want to block this user?');" style="margin-top: 0.5rem;">
                <button type="submit" style="background: none; border: none; color: #d9534f; cursor: pointer; padding: 0; font-size: 0.9rem; text-decoration: underline;">Block User</button>
            </form>
        </div>
        <a href="{{ url_for('chat.my_chats') }}" class="btn">Back to Chats</a>
    </div>

    <div id="messages-container" style="flex-grow: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
        <!-- Messages will be injected here via JS -->
    </div>

    <div class="chat-input" style="padding: 1rem; border-top: 1px solid #ddd; display: flex; gap: 1rem;">
        <input type="text" id="message-input" placeholder="Type your message..." maxlength="500" style="flex-grow: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        <button id="send-btn" style="padding: 0.75rem 1.5rem; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Send</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const conversationId = {{ conversation.id }};
    const currentUserId = {{ current_user.id }};
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    function appendMessage(msg) {
        const div = document.createElement('div');
        const isMe = msg.sender_id === currentUserId;
        
        div.style.maxWidth = '70%';
        div.style.padding = '0.75rem 1rem';
        div.style.borderRadius = '16px';
        div.style.marginBottom = '0.5rem';
        
        if (isMe) {
            div.style.alignSelf = 'flex-end';
            div.style.backgroundColor = '#007bff';
            div.style.color = 'white';
        } else {
            div.style.alignSelf = 'flex-start';
            div.style.backgroundColor = '#f1f0f0';
            div.style.color = 'black';
        }
        
        const sender = document.createElement('small');
        sender.textContent = isMe ? 'You' : msg.sender_name;
        sender.style.display = 'block';
        sender.style.marginBottom = '0.25rem';
        sender.style.opacity = '0.8';
        sender.style.fontSize = '0.75rem';
        
        const text = document.createElement('div');
        text.textContent = msg.message_text;
        
        div.appendChild(sender);
        div.appendChild(text);
        
        messagesContainer.appendChild(div);
    }

    let lastMessageCount = 0;

    async function fetchMessages() {
        try {
            const response = await fetch(`/api/chat/${conversationId}/messages`);
            if (response.ok) {
                const data = await response.json();
                if (data.messages.length > lastMessageCount) {
                    messagesContainer.innerHTML = '';
                    data.messages.forEach(appendMessage);
                    lastMessageCount = data.messages.length;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            }
        } catch (error) {
            console.error("Error fetching messages:", error);
        }
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        
        try {
            const response = await fetch(`/api/chat/${conversationId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            
            if (response.ok) {
                messageInput.value = '';
                fetchMessages();
            } else {
                const data = await response.json();
                alert(data.error || "Failed to send message.");
            }
        } catch (error) {
            console.error("Error sending message:", error);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Initial fetch and start polling every 3 seconds
    fetchMessages();
    setInterval(fetchMessages, 3000);
</script>
{% endblock %}
