{% extends "base.html" %}

{% block title %}Chat - VisionMatch{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; height: 75vh; padding: 0; overflow: hidden;">
    
    <!-- Chat Header -->
    <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background-color: #f8fafc;">
        <div>
            <h3 style="margin: 0; font-size: 1.15rem; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
                <span style="display: inline-block; width: 8px; height: 8px; background-color: #10b981; border-radius: 50%;"></span>
                {{ item.name }}
            </h3>
            <form method="POST" action="{{ url_for('auth.block', user_id=other_user_id) }}" onsubmit="return confirm('Are you sure you want to block this user?');" style="margin-top: 0.25rem;">
                <button type="submit" style="background: none; border: none; color: #ef4444; cursor: pointer; padding: 0; font-size: 0.85rem; font-weight: 500;">Block User</button>
            </form>
        </div>
        <a href="{{ url_for('chat.my_chats') }}" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Back</a>
    </div>

    <!-- Messages Area -->
    <div id="messages-container" style="flex-grow: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background-color: #ffffff;">
        <!-- Messages will be injected here via JS -->
    </div>

    <!-- Input Area -->
    <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; gap: 1rem; background-color: #f8fafc;">
        <input type="text" id="message-input" class="form-control" placeholder="Type your message..." maxlength="500" style="margin-bottom: 0; flex-grow: 1; border-radius: 9999px; padding-left: 1.25rem; padding-right: 1.25rem;">
        <button id="send-btn" class="btn btn-primary" style="border-radius: 9999px; padding-left: 1.5rem; padding-right: 1.5rem;">Send</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const conversationId = {{ conversation.id }};
    const currentUserId = {{ current_user.id }};
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    function appendMessage(msg) {
        const div = document.createElement('div');
        const isMe = msg.sender_id === currentUserId;
        
        div.style.maxWidth = '75%';
        div.style.padding = '0.75rem 1.25rem';
        div.style.borderRadius = '18px';
        div.style.position = 'relative';
        
        if (isMe) {
            div.style.alignSelf = 'flex-end';
            div.style.backgroundColor = 'var(--primary)';
            div.style.color = 'white';
            div.style.borderBottomRightRadius = '4px';
        } else {
            div.style.alignSelf = 'flex-start';
            div.style.backgroundColor = '#f1f5f9';
            div.style.color = 'var(--text-main)';
            div.style.borderBottomLeftRadius = '4px';
        }
        
        const sender = document.createElement('small');
        sender.textContent = isMe ? 'You' : msg.sender_name;
        sender.style.display = 'block';
        sender.style.marginBottom = '0.25rem';
        sender.style.opacity = isMe ? '0.9' : '0.6';
        sender.style.fontSize = '0.75rem';
        sender.style.fontWeight = '500';
        
        const text = document.createElement('div');
        text.textContent = msg.message_text;
        text.style.lineHeight = '1.4';
        
        div.appendChild(sender);
        div.appendChild(text);
        
        messagesContainer.appendChild(div);
    }

    let lastMessageCount = 0;

    async function fetchMessages() {
        try {
            const response = await fetch(`/api/chat/${conversationId}/messages`);
            if (response.ok) {
                const data = await response.json();
                if (data.messages.length > lastMessageCount) {
                    messagesContainer.innerHTML = '';
                    data.messages.forEach(appendMessage);
                    lastMessageCount = data.messages.length;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            }
        } catch (error) {
            console.error("Error fetching messages:", error);
        }
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        
        try {
            const response = await fetch(`/api/chat/${conversationId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            
            if (response.ok) {
                messageInput.value = '';
                fetchMessages();
            } else {
                const data = await response.json();
                alert(data.error || "Failed to send message.");
            }
        } catch (error) {
            console.error("Error sending message:", error);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Initial fetch and start polling every 3 seconds
    fetchMessages();
    setInterval(fetchMessages, 3000);
    
    // Add hover effect to list items in chats.html logic if needed, 
    // but handled by inline transition in HTML
</script>
{% endblock %}
