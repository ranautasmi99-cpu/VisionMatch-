<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VisionMatch - Smart College Lost & Found{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Navigation Header -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                VisionMatch
            </a>
            <ul class="nav-links">
                <li><a href="/" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="/report" class="{% if request.endpoint == 'report' %}active{% endif %}">Report Item</a></li>
                <li><a href="/search" class="{% if request.endpoint == 'search' %}nav-btn{% else %}nav-btn{% endif %}">Search Item</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Body Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 VisionMatch &bull; Smart College Lost & Found System</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
